<div class="add-user-container">
  <div class="add-user-card">
    <div class="form-header">
      <h2>➕ Add New User</h2>
      <p>Create a new user account</p>
    </div>

    <form>
      <div class="form-group">
        <label>Username *</label>
        <input class="form-input" [(ngModel)]="user.username" name="username" placeholder="Enter username" required />
      </div>

      <div class="form-group">
        <label>Full Name</label>
        <input class="form-input" [(ngModel)]="user.name" name="name" placeholder="Enter full name" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Temporary Password *</label>
          <input class="form-input" type="password" [(ngModel)]="tempPassword" name="tempPassword"
            placeholder="Enter temporary password" required />
        </div>

        <div class="form-group">
          <label>Confirm Password *</label>
          <input class="form-input" type="password" [(ngModel)]="confirmPassword" name="confirmPassword"
            placeholder="Confirm password" required />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Email</label>
          <input class="form-input" [(ngModel)]="user.gmail" name="gmail" type="email" placeholder="user@example.com" />
        </div>

        <!-- ✅ Year Dropdown -->
        <div class="form-group">
          <label>Year</label>
          <div class="custom-dropdown" (click)="toggleYearDropdown()">
            <span>{{ selectedYearName || 'Select Year' }}</span>
            <ul *ngIf="yearDropdownOpen" class="dropdown-list">
              <li *ngFor="let y of years" (click)="selectYear(y, $event)">
                {{ y.yearName }}
              </li>
            </ul>
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Mobile Number</label>
          <input class="form-input" [(ngModel)]="user.mobileNumber" name="mobileNumber"
            placeholder="Enter mobile number" />
        </div>

        <div class="form-group">
          <label>Date of Birth</label>
          <input class="form-input" type="date" [(ngModel)]="user.dateOfBirth" name="dateOfBirth" />
        </div>
      </div>

      <div class="form-row">
        <!-- ✅ Department Dropdown -->
        <div class="form-group">
          <label>Department *</label>
          <div class="custom-dropdown" (click)="toggleDepartmentDropdown()">
            <span>{{ selectedDepartment || 'Select Department' }}</span>
            <ul *ngIf="departmentDropdownOpen" class="dropdown-list">
              <li *ngFor="let dept of departments" (click)="selectDepartment(dept, $event)">
                {{ dept.name }}
              </li>
            </ul>
          </div>
        </div>

        <!-- ✅ Role Dropdown -->
        <div class="form-group">
          <label>Role *</label>
          <div class="custom-dropdown" (click)="toggleRoleDropdown()">
            <span>{{ selectedRole || 'Select Role' }}</span>
            <ul *ngIf="roleDropdownOpen" class="dropdown-list">
              <li *ngFor="let r of roles" (click)="selectRole(r, $event)">
                {{ r.name }}
              </li>
            </ul>
          </div>
        </div>
      </div>

      <button type="button" class="submit-btn" (click)="addUser()">✨ Create User</button>

      <p *ngIf="success" class="success-message">{{ success }}</p>
      <p *ngIf="error" class="error-message">{{ error }}</p>
    </form>
  </div>
</div>
