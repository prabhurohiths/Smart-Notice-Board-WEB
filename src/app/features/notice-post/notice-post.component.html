<div class="post-container">
  <div class="post-card">
    <div class="post-header">
      <h3>📝 Create New Notice</h3>
      <p>Share important information with your audience</p>
    </div>

    <form>
      <div class="form-group">
        <label>Title *</label>
        <input 
          class="form-input" 
          [(ngModel)]="notice.title" 
          name="title"
          placeholder="Enter notice title" 
        />
      </div>

      <div class="form-group">
        <label>Description *</label>
        <textarea 
          class="form-textarea" 
          [(ngModel)]="notice.description" 
          name="description"
          placeholder="Provide detailed information about the notice"
        ></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Department</label>
          <input 
            class="form-input" 
            [(ngModel)]="notice.department" 
            name="department"
            placeholder="e.g., Computer Science" 
          />
        </div>

        <div class="form-group">
          <label>Year</label>
          <input 
            class="form-input" 
            [(ngModel)]="notice.year" 
            name="year"
            type="number" 
            placeholder="e.g., 2025" 
          />
        </div>
      </div>

      <div class="file-upload-wrapper">
        <label class="file-upload-label">
          <span class="upload-icon">📎</span>
          <span>Click to upload images</span>
          <input 
            type="file" 
            class="file-upload-input"
            (change)="onFilesSelected($event)" 
            multiple 
            accept="image/*" 
          />
        </label>
      </div>

      <div *ngIf="previewUrls.length > 0" class="preview-section">
        <h4 class="preview-header">Image Preview</h4>
        <div class="preview-grid">
          <div *ngFor="let img of previewUrls; let i = index" class="preview-item">
            <img [src]="img" class="preview-image" alt="Preview">
            <button type="button" (click)="removeImage(i)" class="remove-btn">✕</button>
          </div>
        </div>
      </div>

      <button type="button" class="submit-btn" (click)="postNotice()">
        🚀 Post Notice
      </button>

      <p *ngIf="success" class="success-message">{{ success }}</p>
      <p *ngIf="error" class="error-message">{{ error }}</p>
    </form>
  </div>
</div>
